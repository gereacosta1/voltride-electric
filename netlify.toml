[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions proxy
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Affirm return routes
[[redirects]]
  from = "/checkout/affirm/confirm"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/checkout/affirm/cancel"
  to = "/index.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200